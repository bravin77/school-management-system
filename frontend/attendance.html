<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Attendance - School Management System</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header>

        <h1>School Management</h1>

        <nav>

            <a href="home.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="students.html">Students</a>
            <a href="teachers.html">Teachers</a>
            <a href="subjects.html">Subjects</a>
            <a href="marks.html">Marks</a>
            <a href="attendance.html">Attendance</a>

        </nav>

    </header>


    <main class="container">

        <h1>Attendance Management</h1>


        <h2>Record Attendance</h2>


        <form id="attendanceForm">

            <input
                type="hidden"
                id="attendanceId"
            >


            <div class="form-group">

                <label for="attendanceStudent">
                    Student
                </label>

                <select
                    id="attendanceStudent"
                    required
                >

                    <option value="">
                        Loading students...
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="attendanceDate">
                    Date
                </label>

                <input
                    type="date"
                    id="attendanceDate"
                    required
                >

            </div>


            <div class="form-group">

                <label for="attendanceStatus">
                    Status
                </label>

                <select
                    id="attendanceStatus"
                    required
                >

                    <option value="">
                        Select status
                    </option>

                    <option value="Present">
                        Present
                    </option>

                    <option value="Absent">
                        Absent
                    </option>

                    <option value="Late">
                        Late
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="btn-primary"
            >
                Save Attendance
            </button>

        </form>


        <hr>


        <h2>Attendance List</h2>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Student</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="attendanceTableBody">

                    <tr>

                        <td colspan="5">
                            Loading attendance...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>


    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/attendance.js"></script>

</body>

</html>
