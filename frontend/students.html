<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Students - School Management System</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

<header>

    <h1>School Management</h1>

    <nav>

        <a href="/home.html">Home</a>

        <a href="/dashboard.html">Dashboard</a>

        <a href="/students.html">Students</a>

        <a href="/teachers.html">Teachers</a>

        <a href="/subjects.html">Subjects</a>

        <a href="/marks.html">Marks</a>

        <a href="/attendance.html">Attendance</a>

    </nav>

</header>


<main class="container">

    <h1>Student Management</h1>


    <form id="studentForm">

        <input
            type="hidden"
            id="studentId"
        >


        <label for="studentName">
            Name
        </label>

        <input
            type="text"
            id="studentName"
            required
        >


        <label for="studentAge">
            Age
        </label>

        <input
            type="number"
            id="studentAge"
            min="1"
            required
        >


        <label for="studentSubjects">
            Subjects
        </label>

        <select
            id="studentSubjects"
            multiple
            size="6"
        >

            <option>
                Loading subjects...
            </option>

        </select>


        <p>
            Hold Ctrl while clicking to select
            multiple subjects.
        </p>


        <button type="submit">
            Save Student
        </button>

    </form>


    <hr>


    <h2>Student List</h2>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Age</th>

                    <th>Subjects</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="studentsTableBody">

                <tr>

                    <td colspan="5">
                        Loading students...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>


<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/students.js"></script>

</body>

</html>
