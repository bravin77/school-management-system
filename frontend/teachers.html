<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Teachers - School Management System</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header>

    <h1>School Management</h1>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="students.html">
            Students
        </a>

        <a href="teachers.html">
            Teachers
        </a>

        <a href="subjects.html">
            Subjects
        </a>

        <a href="marks.html">
            Marks
        </a>

        <a href="attendance.html">
            Attendance
        </a>

    </nav>

</header>


<main class="container">

    <h1>
        Teacher Management
    </h1>


    <!-- TEACHER FORM -->

    <div class="card">

        <h2 id="teacherFormTitle">
            Add Teacher
        </h2>


        <form id="teacherForm">

            <input
                type="hidden"
                id="teacherId"
            >


            <div class="form-group">

                <label for="teacherName">
                    Name
                </label>

                <input
                    type="text"
                    id="teacherName"
                    name="name"
                    placeholder="Enter teacher name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="teacherEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="teacherEmail"
                    name="email"
                    placeholder="Enter teacher email"
                    required
                >

            </div>


            <button
                type="submit"
                id="teacherSubmitButton"
                class="btn-primary"
            >
                Save Teacher
            </button>


            <button
                type="button"
                id="cancelTeacherEdit"
            >
                Cancel
            </button>

        </form>


        <p id="teacherMessage"></p>

    </div>


    <br>


    <!-- TEACHER LIST -->

    <div class="card">

        <h2>
            Teacher List
        </h2>


        <div id="teacherLoading">
            Loading teachers...
        </div>


        <div class="table-container">

            <table
                id="teachersTable"
            >

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Email
                        </th>

                        <th class="actions-column">
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="teachersTableBody">

                    <tr>

                        <td colspan="4">
                            Loading teachers...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


        <p
            id="noTeachersMessage"
            style="display: none;"
        >
            No teachers found.
        </p>

    </div>

</main>


<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/teachers.js"></script>


</body>

</html>
