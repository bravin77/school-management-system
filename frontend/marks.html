<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Marks - School Management System</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header>

    <h1>School Management</h1>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="students.html">
            Students
        </a>

        <a href="teachers.html">
            Teachers
        </a>

        <a href="subjects.html">
            Subjects
        </a>

        <a href="marks.html">
            Marks
        </a>

        <a href="attendance.html">
            Attendance
        </a>

    </nav>

</header>


<main class="container">

    <h1>
        Marks Management
    </h1>


    <!-- =========================
         MARK FORM
    ========================== -->

    <div class="card">

        <h2>
            Record Mark
        </h2>


        <form id="marksForm">

            <input
                type="hidden"
                id="markId"
            >


            <div class="form-group">

                <label for="markStudent">
                    Student
                </label>

                <select
                    id="markStudent"
                    required
                >

                    <option value="">
                        Loading students...
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="markSubject">
                    Subject
                </label>

                <select
                    id="markSubject"
                    required
                >

                    <option value="">
                        Loading subjects...
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="markScore">
                    Score
                </label>

                <input
                    type="number"
                    id="markScore"
                    min="0"
                    max="100"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-primary"
            >
                Save Mark
            </button>

        </form>

    </div>


    <hr>


    <!-- =========================
         MARKS LIST
    ========================== -->

    <div class="card">

        <h2>
            Marks List
        </h2>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Student
                        </th>

                        <th>
                            Subject
                        </th>

                        <th>
                            Score
                        </th>

                        <th class="actions-column">
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="marksTableBody">

                    <tr>

                        <td colspan="5">
                            Loading marks...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>


<!-- =========================
     JAVASCRIPT
========================== -->

<script src="js/config.js"></script>

<script src="js/api.js"></script>

<script src="js/marks.js"></script>


</body>

</html>
